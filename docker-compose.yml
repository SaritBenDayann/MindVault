version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: mindvault-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./server
    container_name: mindvault-backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - REDIS_URI=redis://redis:6379/0
    restart: always